[project]
name = "faro"
version = "0.1.0"
description = "FARO — Copiloto de inteligencia informativa con IA (hackIAthon Panamá 4ta edición · reto TVN Media)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # configuración y esquemas
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
  # scraping y fuentes
  "httpx",
  "feedparser",
  "trafilatura",
  "pdfplumber",
  # datos
  "pandas",
  "numpy",
  # NLP ligero (embeddings de respaldo y métricas)
  "rapidfuzz",
  "scikit-learn",
  # NLP (obligatorio, D-11): embeddings y entidades reales
  "sentence-transformers",
  "spacy",
  # Modelo de spaCy fijado como dependencia directa (offline, M7.1)
  "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
  # LLM
  "litellm",
  # interfaz y grafo
  "streamlit",
  "streamlit-agraph",
  "networkx",
  # integración
  "notion-client",
]

# Scrapling: opcional, solo si un medio exige modo sigiloso.
[project.optional-dependencies]
scrapling = [
  "scrapling",
]

[dependency-groups]
dev = ["pytest", "ruff"]

# torch para CPU en Linux (M7.1): evita instalar la variante CUDA (~3 GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faro", "schemas", "config"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longitud de línea: la maneja ruff format; no bloquear por cadenas largas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
